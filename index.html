<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a workbench. The 9:16 stage (the "phone") owns the left column, the tool panel docks right; on phones they stack. */
:root {
  --bg: #eceef2;
  --surface: #ffffff;
  --surface-2: #f5f6f8;
  --ink: #17171c;
  --muted: #5f6070;
  --line: #d9dbe3;
  --steel: #74717d;
  --accent: #e2392f;
  --accent-ink: #ffffff;
  --accent-soft: #fde6e4;
  --focus: #2156d9;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111115; --surface: #1a1a20; --surface-2: #222229; --ink: #ececf2; --muted: #a3a3b2;
    --line: #2e2e37; --steel: #8d8a97; --accent: #ff5747; --accent-ink: #160505; --accent-soft: #3a1a18; --focus: #7aa2ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111115; --surface: #1a1a20; --surface-2: #222229; --ink: #ececf2; --muted: #a3a3b2;
  --line: #2e2e37; --steel: #8d8a97; --accent: #ff5747; --accent-ink: #160505; --accent-soft: #3a1a18; --focus: #7aa2ff;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 420px); grid-template-rows: auto minmax(0, 1fr);
  gap: 12px 20px; height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -0.01em; margin: 0; white-space: nowrap; }
.brand .scene-name { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 32ch; }
.topbar .spacer { flex: 1; }

.stage-col { display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 0; min-width: 0; }
.stage-wrap { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; justify-content: center; align-items: flex-start; }
.stage { position: relative; }
#stage { display: block; width: 100%; height: 100%; border-radius: 16px; background: #fff; box-shadow: 0 1px 2px rgba(20,20,30,.08), 0 8px 30px rgba(20,20,30,.10); touch-action: none; }
.stage.editing #stage { box-shadow: 0 0 0 3px var(--focus), 0 8px 30px rgba(20,20,30,.12); cursor: crosshair; }
.edit-flag { position: absolute; bottom: 10px; left: 50%; white-space: nowrap; transform: translateX(-50%); background: var(--focus); color: #fff; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; pointer-events: none; }

.transport { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--steel); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.icon { width: 36px; padding: 0; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); min-width: 92px; }
.btn.rec[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.rec .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.btn.rec[aria-pressed="true"] .dot { background: var(--accent-ink); animation: blink 1s steps(2) infinite; }
.btn[aria-pressed="true"]:not(.rec) { background: var(--focus); border-color: var(--focus); color: #fff; }
.btn.small { height: 30px; padding: 0 10px; font-size: 13px; }
.btn.danger { color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
@keyframes blink { 50% { opacity: .2; } }
select.btn { padding: 0 8px; }

.panel { min-height: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
.tabs button { flex: 1; height: 42px; border: 0; background: none; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.panel-body { overflow: auto; padding: 14px; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 14px; }

.section-title { font-family: var(--font-display); font-weight: 600; font-size: 15px; margin: 0; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0; }

.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
.tpl { display: flex; flex-direction: column; gap: 6px; padding: 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); cursor: pointer; text-align: left; }
.tpl:hover { border-color: var(--steel); }
.tpl.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.tpl canvas { width: 100%; aspect-ratio: 9 / 16; border-radius: 8px; display: block; background: #fff; }
.tpl b { font-size: 13px; font-weight: 600; line-height: 1.2; }
.tpl span { font-size: 12px; color: var(--muted); line-height: 1.3; }

.fields { display: grid; gap: 10px; }
.field { display: grid; grid-template-columns: 112px minmax(0, 1fr); align-items: center; gap: 8px; }
.field > label { font-size: 13px; color: var(--muted); }
.field .ctl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.field input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
.field input[type="number"] { width: 72px; font-family: var(--font-mono); font-size: 12px; }
.field input[type="number"], .field input[type="text"], .field select, textarea {
  height: 30px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); min-width: 0;
}
.field input[type="text"], .field select { flex: 1; width: 100%; }
textarea { height: auto; padding: 8px; width: 100%; font-family: var(--font-mono); font-size: 12px; resize: vertical; }
.field input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
.swatches { display: flex; flex-wrap: wrap; gap: 5px; }
.swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; position: relative; }
.swatch[aria-checked="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--surface); }
.swatch input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }

.add-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.add-grid button { justify-content: flex-start; }
.part-list { display: flex; flex-direction: column; gap: 8px; }
.part { border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.part.selected { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
.part-head { display: flex; align-items: center; gap: 10px; padding: 8px 10px; cursor: pointer; width: 100%; background: none; border: 0; text-align: left; }
.part-head .glyph { width: 26px; height: 26px; border-radius: 7px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
.part-head .glyph svg { width: 16px; height: 16px; }
.part-head .txt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.part-head .txt b { font-weight: 600; font-size: 13px; }
.part-head .txt span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.part-head .chev { color: var(--muted); transition: transform .15s; }
.part.open .chev { transform: rotate(90deg); }
.part-body { padding: 4px 10px 12px; display: grid; gap: 12px; }
.part-actions { display: flex; gap: 6px; flex-wrap: wrap; }

.save-row { display: flex; gap: 8px; }
.save-row input { flex: 1; min-width: 0; height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
.saved-list { display: flex; flex-direction: column; gap: 6px; }
.saved { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.saved .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.saved .txt b { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.saved .txt span { font-size: 12px; color: var(--muted); }
.empty { padding: 14px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: 13px; text-align: center; }
hr { border: 0; border-top: 1px solid var(--line); margin: 0; width: 100%; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; display: flex; gap: 12px; align-items: center; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 20; max-width: calc(100% - 32px); }
.toast button { background: none; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; padding: 0; }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { display: block; height: auto; }
  .topbar { margin-bottom: 12px; }
  .stage-col { margin-bottom: 14px; }
  .panel { overflow: visible; }
  .panel-body { overflow: visible; }
  .field { grid-template-columns: 100px minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .btn.rec[aria-pressed="true"] .dot { animation: none; }
  .part-head .chev { transition: none; }
}
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="11" cy="12" r="3.2" fill="#e53935"/><circle cx="20" cy="11" r="3.2" fill="#16b39a"/>
        <circle cx="13" cy="21" r="3.2" fill="#e055d6"/><circle cx="21" cy="20" r="3.2" fill="#2156d9"/>
      </svg>
      <h1>Ball Multiplier Lab</h1>
      <span class="scene-name" id="sceneName"></span>
    </div>
    <div class="spacer"></div>
    <button class="btn small" id="uiTheme" type="button" title="Switch the app between light and dark">Theme</button>
  </header>

  <main class="stage-col">
    <div class="stage-wrap" id="stageWrap">
      <div class="stage" id="stageBox">
        <canvas id="stage" width="720" height="1280" aria-label="Simulation stage"></canvas>
        <div class="edit-flag" id="editFlag" hidden>Drag the dots to move parts</div>
      </div>
    </div>
    <div class="transport" role="toolbar" aria-label="Playback">
      <button class="btn primary" id="playBtn" type="button"></button>
      <button class="btn icon" id="restartBtn" type="button" title="Restart (R)" aria-label="Restart"></button>
      <select class="btn" id="speedSel" title="Playback speed" aria-label="Playback speed">
        <option value="0.25">0.25&times;</option><option value="0.5">0.5&times;</option><option value="1" selected>1&times;</option><option value="2">2&times;</option><option value="4">4&times;</option>
      </select>
      <button class="btn" id="editBtn" type="button" aria-pressed="false" title="Edit layout (E)"></button>
      <button class="btn rec" id="recBtn" type="button" aria-pressed="false" title="Record the run from the start"><span class="dot"></span><span id="recLabel">Record</span></button>
      <button class="btn icon" id="soundBtn" type="button" aria-pressed="true" title="Sound" aria-label="Sound"></button>
      <button class="btn" id="seedBtn" type="button" title="Roll a new random seed"></button>
    </div>
  </main>

  <aside class="panel" aria-label="Simulation setup">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-templates" aria-selected="true" data-tab="templates">Templates</button>
      <button role="tab" id="tab-scene" aria-selected="false" data-tab="scene">Scene</button>
      <button role="tab" id="tab-parts" aria-selected="false" data-tab="parts">Parts</button>
      <button role="tab" id="tab-saved" aria-selected="false" data-tab="saved">Saved</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>
</div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
/* ==========================================================================
   Constants and helpers
   ========================================================================== */
const WORLD_W = 540, WORLD_H = 960;
const CANVAS_W = 720, CANVAS_H = 1280, SCALE = CANVAS_W / WORLD_W;
const DT = 1 / 240;
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const X = '×';
const DEFAULT_PALETTE = ['#e53935', '#16b39a', '#e055d6', '#2e8b37', '#a99cf0', '#8e4a26', '#2156d9', '#77751a', '#f08a1c', '#19a7d6', '#d81b60', '#8a8f9c'];

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeIn = t => t * t * t;
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const fmt = n => Math.round(n).toLocaleString('en-US');

function hexToRgb(h) {
  h = String(h || '#888').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16) || 0;
  return [n >> 16 & 255, n >> 8 & 255, n & 255];
}
function shade(hex, amt) {
  const [r, g, b] = hexToRgb(hex);
  const f = c => Math.round(amt >= 0 ? c + (255 - c) * amt : c * (1 + amt));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function colorName(hex) {
  const [r, g, b] = hexToRgb(hex).map(v => v / 255);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  if (d < 0.12) return l > 0.75 ? 'White' : l < 0.2 ? 'Black' : 'Grey';
  let h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  h = (h * 60 + 360) % 360;
  if (h < 15 || h >= 340) return 'Red';
  if (h < 40) return l < 0.4 ? 'Brown' : 'Orange';
  if (h < 68) return l < 0.35 ? 'Olive' : 'Yellow';
  if (h < 150) return 'Green';
  if (h < 185) return 'Teal';
  if (h < 250) return 'Blue';
  if (h < 290) return 'Purple';
  return 'Pink';
}

/* ==========================================================================
   Part types: defaults, editor fields and summaries
   ========================================================================== */
const N = (k, label, min, max, step = 1) => ({ k, label, t: 'num', min, max, step });
const S = (k, label, options) => ({ k, label, t: 'sel', options });
const B = (k, label) => ({ k, label, t: 'bool' });
const T = (k, label) => ({ k, label, t: 'text' });
const P = (k, label) => ({ k, label, t: 'pal' });
const XY = [N('x', 'X', -100, 640), N('y', 'Y', -100, 1060)];
const LINE = [N('x1', 'Start X', -100, 640), N('y1', 'Start Y', -100, 1060), N('x2', 'End X', -100, 640), N('y2', 'End Y', -100, 1060)];
const COLOR_MODES = [['keep', 'Keep colour'], ['next', 'Next colour'], ['fixed', 'Set colour'], ['random', 'Random colour']];

const PART_TYPES = {
  container: {
    label: 'Circle wall', glyph: 'circle',
    desc: 'A round wall. Add gaps and spin to make escape rings.',
    defaults: { x: 270, y: 470, radius: 220, thickness: 3, gaps: 0, gapSize: 40, gapAngle: -90, spin: 0, bounce: 1, onHit: 'none', hitCooldown: 1, growBy: 1.5, burst: true },
    fields: [...XY, N('radius', 'Radius', 20, 300), N('thickness', 'Thickness', 1, 24), N('gaps', 'Gaps', 0, 8), N('gapSize', 'Gap size (deg)', 4, 150),
      N('gapAngle', 'Gap angle', -180, 180), N('spin', 'Spin (deg/s)', -360, 360), N('bounce', 'Bounciness', 0, 1.2, 0.01),
      S('onHit', 'When hit', [['none', 'Nothing'], ['addBall', 'Add a ball'], ['grow', 'Ball grows']]), N('hitCooldown', 'Hit cooldown (s)', 0, 4, 0.05),
      N('growBy', 'Grow by', 0, 10, 0.1), B('burst', 'Breaks at finale')],
    summary: c => `r ${c.radius}${c.gaps ? ` · ${c.gaps} gap${c.gaps > 1 ? 's' : ''}` : ''}${c.spin ? ` · spins ${c.spin}°/s` : ''}${c.onHit !== 'none' ? (c.onHit === 'grow' ? ' · grows balls' : ' · adds balls') : ''}`
  },
  wall: {
    label: 'Wall', glyph: 'line',
    desc: 'A straight bar. Give it spin to make a paddle.',
    defaults: { x1: 170, y1: 480, x2: 370, y2: 480, thickness: 10, spin: 0, bounce: 0.6, friction: 0.02 },
    handles: [['x1', 'y1'], ['x2', 'y2'], ['mid']],
    fields: [...LINE, N('thickness', 'Thickness', 2, 40), N('spin', 'Spin (deg/s)', -720, 720), N('bounce', 'Bounciness', 0, 1.2, 0.01), N('friction', 'Grip', 0, 0.6, 0.01)],
    summary: c => `${Math.round(Math.hypot(c.x2 - c.x1, c.y2 - c.y1))} long${c.spin ? ` · spins ${c.spin}°/s` : ''}`
  },
  spinner: {
    label: 'Spinner', glyph: 'spinner',
    desc: 'Rotating bars that bat balls around.',
    defaults: { x: 270, y: 480, length: 140, bars: 1, speed: 120, thickness: 9, phase: 0, bounce: 0.7 },
    fields: [...XY, N('length', 'Length', 20, 420), N('bars', 'Bars', 1, 4), N('speed', 'Speed (deg/s)', -720, 720), N('thickness', 'Thickness', 3, 30),
      N('phase', 'Start angle', 0, 180), N('bounce', 'Bounciness', 0, 1.2, 0.01)],
    summary: c => `${c.bars} bar${c.bars > 1 ? 's' : ''} · ${c.speed}°/s`
  },
  conveyor: {
    label: 'Conveyor', glyph: 'conveyor',
    desc: 'A moving belt that carries balls along.',
    defaults: { x1: 100, y1: 500, x2: 440, y2: 520, speed: 140, thickness: 12, friction: 0.3 },
    handles: [['x1', 'y1'], ['x2', 'y2'], ['mid']],
    fields: [...LINE, N('speed', 'Belt speed', -500, 500), N('thickness', 'Thickness', 4, 30), N('friction', 'Grip', 0, 0.8, 0.01)],
    summary: c => `${Math.abs(c.speed)} px/s ${c.speed >= 0 ? 'to end' : 'to start'}`
  },
  crusher: {
    label: 'Crusher arms', glyph: 'crusher',
    desc: 'Two arms fold into a box and crush what is inside into new balls.',
    defaults: { x: 270, y: 470, boxW: 180, boxH: 100, reach: 330, thickness: 11, period: 2.2, phase: 0, factor: 4, colorMode: 'next', color: 0, magnifier: true, label: 'CRUSHER' },
    fields: [...XY, N('boxW', 'Box width', 40, 320), N('boxH', 'Box height', 24, 220), N('reach', 'Arm length', 60, 520), N('thickness', 'Thickness', 4, 24),
      N('period', 'Cycle (s)', 0.8, 8, 0.1), N('phase', 'Start offset', 0, 1, 0.01), N('factor', `Balls per crush`, 0, 12),
      S('colorMode', 'New colour', COLOR_MODES), P('color', 'Set colour'), B('magnifier', 'Zoom on crush'), T('label', 'Arm label')],
    summary: c => `${X}${c.factor} per crushed ball · every ${c.period}s`
  },
  press: {
    label: 'Press', glyph: 'press',
    desc: 'A stamp that slams down and splits balls under it.',
    defaults: { x: 270, y: 380, width: 70, stroke: 90, period: 1.8, phase: 0, factor: 2, colorMode: 'next', color: 0 },
    fields: [...XY, N('width', 'Width', 20, 240), N('stroke', 'Stroke', 10, 320), N('period', 'Cycle (s)', 0.4, 6, 0.1), N('phase', 'Start offset', 0, 1, 0.01),
      N('factor', 'Balls per hit', 0, 12), S('colorMode', 'New colour', COLOR_MODES), P('color', 'Set colour')],
    summary: c => `${X}${c.factor} · every ${c.period}s`
  },
  spiral: {
    label: 'Spiral', glyph: 'spiral',
    desc: 'A rotating spiral that pumps balls toward its centre through gates.',

function normalizeScene(raw) {
  if (!raw || typeof raw !== 'object' || !Array.isArray(raw.parts)) throw new Error('This file is not a simulation setup.');
  const s = Object.assign(clone(SETTINGS_DEFAULTS), raw.settings || {});
  if (raw.settings && raw.settings.showCounters === false && !raw.settings.counters) s.counters = 'off';
  delete s.showCounters;
  if (!Array.isArray(s.palette) || !s.palette.length) s.palette = DEFAULT_PALETTE.slice();
  const parts = raw.parts.filter(p => p && PART_TYPES[p.type]).map(p => Object.assign({ id: uid() }, clone(PART_TYPES[p.type].defaults), p));
  return { v: 1, settings: s, parts };
}

/* ==========================================================================
   Physics: parts at runtime
   ========================================================================== */
class Part {
  constructor(cfg) { this.cfg = cfg; this.broken = false; this.prevSegs = null; }
  get burstable() { return false; }
  segs() { return null; }
  arcs() { return null; }
  sensors() {}
  update() {}
}

class ContainerPart extends Part {
  get burstable() { return this.cfg.burst !== false; }
  arcs(t) {
    const c = this.cfg; if (this.broken) return null;
    const hw = Math.max(0.75, c.thickness / 2), omega = (c.spin || 0) * DEG, rot = omega * t, out = [];
    const base = { cx: c.x, cy: c.y, R: c.radius, hw, omega, e: c.bounce, fr: 0, owner: this };
    if (!c.gaps) out.push(Object.assign({ a0: 0, span: TAU, full: true }, base));
    else {
      const n = Math.round(c.gaps), gs = Math.min(c.gapSize * DEG, TAU / n * 0.95), step = TAU / n;
      for (let i = 0; i < n; i++) out.push(Object.assign({ a0: c.gapAngle * DEG + rot + i * step + gs / 2, span: step - gs }, base));
    }
    return out;
  }
  onHit(b, vn, sim) {
    const c = this.cfg;
    if (c.onHit === 'none' || vn < 60 || b.hitCd > sim.t) return;
    b.hitCd = sim.t + c.hitCooldown;
    if (c.onHit === 'addBall') {
      const dx = c.x - b.x, dy = c.y - b.y, d = Math.hypot(dx, dy) || 1, a = sim.rng() * TAU, sp = 120 + sim.rng() * 160;
      const nb = sim.addBall(b.x + dx / d * b.r * 2.2, b.y + dy / d * b.r * 2.2, Math.cos(a) * sp, Math.sin(a) * sp, (b.c + 1) % sim.pal.length, b.r);
      if (nb) { nb.hitCd = sim.t + c.hitCooldown; sim.emit('multiply', b.x, b.y, nb.c); }
    } else if (c.onHit === 'grow') {
      b.r = Math.min(b.r + c.growBy, c.radius * 0.96);
      sim.emit('grow', b.x, b.y, b.c);
    }
  }
  onBreak(sim) {
    const c = this.cfg; this.breakT = sim.t; this.frags = [];
    const n = 18;
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU, sp = 140 + sim.rng() * 160;
      this.frags.push({ a, span: TAU / n * 0.9, vx: Math.cos(a + TAU / n / 2) * sp, vy: Math.sin(a + TAU / n / 2) * sp, spin: (sim.rng() - 0.5) * 6 });
    }
  }
}

class WallPart extends Part {
  segs(t) {
    const c = this.cfg; if (this.broken) return null;
    let { x1, y1, x2, y2 } = c;
    if (c.spin) {
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, a = c.spin * DEG * t, co = Math.cos(a), si = Math.sin(a);
      const r1x = x1 - mx, r1y = y1 - my;
      x1 = mx + r1x * co - r1y * si; y1 = my + r1x * si + r1y * co;
      x2 = mx - r1x * co + r1y * si; y2 = my - r1x * si - r1y * co;
    }
    return [{ ax: x1, ay: y1, bx: x2, by: y2, hw: c.thickness / 2, e: c.bounce, fr: c.friction, surf: 0 }];
  }
  get burstable() { return true; }
}

class ConveyorPart extends Part {
  segs() {
    const c = this.cfg; if (this.broken) return null;
    return [{ ax: c.x1, ay: c.y1, bx: c.x2, by: c.y2, hw: c.thickness / 2, e: 0.1, fr: c.friction, surf: c.speed }];
  }
  get burstable() { return true; }
}

class SpinnerPart extends Part {
  segs(t) {
    const c = this.cfg, out = [], n = Math.max(1, Math.round(c.bars)), L = c.length / 2;
    for (let i = 0; i < n; i++) {
      const a = (c.phase + c.speed * t) * DEG + i * Math.PI / n, dx = Math.cos(a) * L, dy = Math.sin(a) * L;
      out.push({ ax: c.x - dx, ay: c.y - dy, bx: c.x + dx, by: c.y + dy, hw: c.thickness / 2, e: c.bounce, fr: 0.05, surf: 0 });
    }
    return out;
  }
}

class CrusherPart extends Part {
  constructor(cfg) { super(cfg); this.pending = []; this.lastP = null; }
  state(t) {
    const c = this.cfg, p = ((t / c.period) + c.phase) % 1;
    // slide in -> fold the flaps shut -> squeeze -> release -> unfold -> slide out
    let u = 0, f = 0;
    const seg = (a, b) => easeInOut((p - a) / (b - a));
    if (p < 0.18) { u = 0; f = 0; }
    else if (p < 0.32) { u = seg(0.18, 0.32); }
    else if (p < 0.44) { u = 1; f = seg(0.32, 0.44); }
    else if (p < 0.5) { u = 1; f = 1; }
    else if (p < 0.58) { u = 1 + easeIn((p - 0.5) / 0.08); f = 1; }
    else if (p < 0.63) { u = 2; f = 1; }
    else if (p < 0.7) { u = 2 - seg(0.63, 0.7); f = 1; }
    else if (p < 0.8) { u = 1; f = 1 - seg(0.7, 0.8); }
    else if (p < 0.94) { u = 1 - seg(0.8, 0.94); }
    const hw = c.thickness / 2, W = c.boxW, H = c.boxH;
    const topX = u <= 1 ? lerp(c.x + W / 2 + hw, c.x - W / 2, u) : lerp(c.x - W / 2, c.x - hw, u - 1);
    const botX = 2 * c.x - topX;
    // flaps rest pointing outward along the arm and swing inward, sweeping balls into the box
    return { p, u, f, hw, topX, botX, yTop: c.y - H / 2, yBot: c.y + H / 2, aTop: Math.PI - f * Math.PI / 2, aBot: -f * Math.PI / 2 };
  }
  segs(t) {
    const c = this.cfg, s = this.state(t), H = c.boxH, fr = 0.02, e = 0.6;
    return [
      { ax: s.topX, ay: s.yTop, bx: s.topX + c.reach, by: s.yTop, hw: s.hw, e, fr, surf: 0 },
      { ax: s.topX, ay: s.yTop, bx: s.topX + Math.cos(s.aTop) * H, by: s.yTop + Math.sin(s.aTop) * H, hw: s.hw, e, fr, surf: 0 },
      { ax: s.botX - c.reach, ay: s.yBot, bx: s.botX, by: s.yBot, hw: s.hw, e, fr, surf: 0 },
      { ax: s.botX, ay: s.yBot, bx: s.botX + Math.cos(s.aBot) * H, by: s.yBot + Math.sin(s.aBot) * H, hw: s.hw, e, fr, surf: 0 }
    ];
  }
  update(sim) {
    const c = this.cfg, s = this.state(sim.t);
    if (s.u > 1) {
      const x0 = s.topX + s.hw, x1 = s.botX - s.hw, y0 = s.yTop + s.hw, y1 = s.yBot - s.hw, w = x1 - x0;
      for (const b of sim.balls) {
        if (b.dead || b.x < x0 - 1 || b.x > x1 + 1 || b.y < y0 || b.y > y1) continue;
        if (w < b.r * 2.3) { b.dead = true; this.pending.push(b.c); sim.emit('debris', b.x, b.y, b.c); }
      }
    }
    const crushAt = 0.58;
    if (this.lastP !== null && this.lastP < crushAt && s.p >= crushAt) {
      if (this.pending.length) {
        const r = sim.settings.ballRadius;
        let side = 0;
        for (const col of this.pending) {
          const nc = sim.colorFor(col, c.colorMode, c.color);
          for (let k = 0; k < c.factor; k++) {
            side ^= 1;
            const sx = side ? -1 : 1;
            const jx = sim.rng(), jy = sim.rng();
            sim.queueBall(
              c.x + sx * (r * 2 + jx * c.boxW * 0.35),
              side ? s.yTop - s.hw - r - 1 - jy * r * 3 : s.yBot + s.hw + r + 1 + jy * r * 3,
              sx * (60 + sim.rng() * 160), (side ? -1 : 1) * (60 + sim.rng() * 160), nc, r);
          }
        }
        sim.emit('crush', c.x, c.y, sim.colorFor(this.pending[0], c.colorMode, c.color), { count: this.pending.length * c.factor, magnify: c.magnifier });
        this.pending = [];
      }
    }
    this.lastP = s.p;
  }
}

class PressPart extends Part {
  headY(t) {
    const c = this.cfg, p = ((t / c.period) + c.phase) % 1;
    let k = 0, phase = 'rest';
    if (p < 0.45) k = 0;
    else if (p < 0.57) { k = easeIn((p - 0.45) / 0.12); phase = 'slam'; }
    else if (p < 0.67) { k = 1; phase = 'hold'; }
    else k = 1 - easeInOut((p - 0.67) / 0.33);
    return { y: c.y + c.stroke * k, phase };
  }
  segs(t) {
    const c = this.cfg, h = this.headY(t).y, w = c.width / 2, hw = 5;
    return [
      { ax: c.x - w, ay: h, bx: c.x + w, by: h, hw, e: 0.3, fr: 0.05, surf: 0 },
      { ax: c.x - w, ay: h, bx: c.x - w, by: h - 30, hw, e: 0.3, fr: 0.05, surf: 0 },
      { ax: c.x + w, ay: h, bx: c.x + w, by: h - 30, hw, e: 0.3, fr: 0.05, surf: 0 }
    ];
  }
  update(sim) {
    const c = this.cfg, st = this.headY(sim.t);
    if (st.phase !== 'slam') return;
    const w = c.width / 2, hy = st.y + 5;
    for (const b of sim.balls) {
      if (b.dead || b.pressCd > sim.t) continue;
      if (Math.abs(b.x - c.x) < w && b.y > st.y - 2 && b.y - b.r < hy + 1) {
        b.dead = true;
        const nc = sim.colorFor(b.c, c.colorMode, c.color);
        for (let k = 0; k < c.factor; k++) {
          const sx = k % 2 ? 1 : -1, off = w + b.r + 2 + Math.floor(k / 2) * b.r * 2.2;
          const nb = sim.addBall(c.x + sx * off, b.y - b.r * 0.5, sx * (90 + sim.rng() * 90), -60 - sim.rng() * 80, nc, b.r);
          if (nb) nb.pressCd = sim.t + c.period * 0.5;
        }
        sim.emit('press', b.x, b.y, nc);
      }
    }
  }
}

class SpiralPart extends Part {
  constructor(cfg) {
    super(cfg);
    const total = TAU * cfg.turns;
    this.pts = [];
    for (let th = 0; th <= total + 1e-6; th += Math.min(0.14, 18 / (cfg.innerR + cfg.pitch * th / TAU))) this.pts.push([th, cfg.innerR + cfg.pitch * th / TAU]);
    const last = this.pts[this.pts.length - 1];
    if (last[0] < total) this.pts.push([total, cfg.innerR + cfg.pitch * cfg.turns]);
  }
  get burstable() { return true; }
  rot(t) { return this.cfg.spin * DEG * t; }
  segs(t) {
    if (this.broken) return null;
    const c = this.cfg, rot = this.rot(t), h = Number(c.handed) || 1, out = [];
    let px = 0, py = 0;
    for (let i = 0; i < this.pts.length; i++) {
      const [th, r] = this.pts[i], a = h * th + rot, x = c.x + Math.cos(a) * r, y = c.y + Math.sin(a) * r;
      if (i) out.push({ ax: px, ay: py, bx: x, by: y, hw: c.thickness / 2, e: c.bounce, fr: 0.04, surf: 0 });
      px = x; py = y;
    }
    return out;
  }
  gateGeom(t) {
    const c = this.cfg, n = Math.round(c.gates), out = [];
    if (!n || c.turns <= 1) return out;
    const rot = this.rot(t), h = Number(c.handed) || 1, hw = c.thickness / 2;
    for (let i = 0; i < n; i++) {
      const th = TAU * (c.turns - 1) * (i + 0.5) / n, a = h * th + rot;
      const r0 = c.innerR + c.pitch * th / TAU + hw + 1, r1 = r0 + c.pitch - 2 * hw - 2;
      out.push({ ax: c.x + Math.cos(a) * r0, ay: c.y + Math.sin(a) * r0, bx: c.x + Math.cos(a) * r1, by: c.y + Math.sin(a) * r1 });
    }
    return out;
  }
  sensors(sim, out) {
    if (this.broken) return;
    const c = this.cfg;
    for (const g of this.gateGeom(sim.t)) out.push({ kind: 'seg', once: true, ...g, fn: b => sim.multiply(b, c.gateFactor, c.gateColorMode, c.gateColor, true) });
  }
}

class PegsPart extends Part {
  constructor(cfg) {
    super(cfg);
    this.pegs = [];
    const dy = cfg.spacing * 0.866;
    for (let i = 0; i < cfg.rows; i++) {
      const n = cfg.layout === 'grid' ? cfg.start + (i % 2 ? 0 : 1) : cfg.start + i;
      for (let j = 0; j < n; j++) this.pegs.push([cfg.x + (j - (n - 1) / 2) * cfg.spacing, cfg.y + i * dy]);
    }
  }
  get burstable() { return true; }
  segs() {
    if (this.broken) return null;
    const c = this.cfg;
    return this.pegs.map(([x, y]) => ({ ax: x, ay: y, bx: x, by: y, hw: c.pegR, e: c.bounce, fr: 0.02, surf: 0 }));
  }
}

function parseMultipliers(s) { return String(s).split(',').map(v => Math.max(0, Math.round(Number(v.trim()) || 0))).slice(0, 16); }

class SlotsPart extends Part {
  constructor(cfg) { super(cfg); this.mult = parseMultipliers(cfg.multipliers); if (!this.mult.length) this.mult = [1]; }
  get burstable() { return true; }
  geom() {
    const c = this.cfg, n = this.mult.length, x0 = c.x - c.width / 2, w = c.width / n, top = c.y - c.height / 2, bot = c.y + c.height / 2;
    return { n, x0, w, top, bot };
  }
  segs() {
    if (this.broken) return null;
    const c = this.cfg, g = this.geom(), hw = c.thickness / 2, out = [];
    for (let i = 0; i <= g.n; i++) out.push({ ax: g.x0 + i * g.w, ay: g.top, bx: g.x0 + i * g.w, by: g.bot, hw, e: 0.3, fr: 0.05, surf: 0 });
    out.push({ ax: g.x0, ay: g.bot, bx: g.x0 + g.n * g.w, by: g.bot, hw, e: 0.2, fr: 0.1, surf: 0 });
    return out;
  }
  sensors(sim, out) {
    if (this.broken) return;
    const c = this.cfg, g = this.geom();
    for (let i = 0; i < g.n; i++) {
      const m = this.mult[i], idx = i;
      out.push({
        kind: 'rect', once: true, x0: g.x0 + i * g.w, x1: g.x0 + (i + 1) * g.w, y0: g.top + (g.bot - g.top) * 0.35, y1: g.bot,
        fn: b => {
          const mode = c.colorMode === 'slot' ? 'fixed' : c.colorMode;
          if (c.action === 'teleport') {
            if (m <= 0) { b.dead = true; sim.emit('destroy', b.x, b.y, b.c); return; }
            const nc = sim.colorFor(b.c, mode, idx);
            for (let k = 0; k < m; k++) {
              const nb = k === 0 ? b : sim.addBall(0, 0, 0, 0, nc, b.r);
              if (!nb) break;
              nb.c = nc; sim.teleport(nb, c.tx, c.ty - k * nb.r * 2.2, c.spread);
            }
            sim.emit('multiply', b.x, c.y, nc, { factor: m });
          } else sim.multiply(b, m, mode, idx, false);
        }
      });
    }
  }
}

class ZonePart extends Part {
  constructor(cfg) { super(cfg); this.lastFire = -1e9; }
  sensors(sim, out) {
    const c = this.cfg;
    const fn = b => {
      if (c.cooldown > 0) { if (sim.t - this.lastFire < c.cooldown) return; this.lastFire = sim.t; }
      switch (c.action) {
        case 'multiply': sim.multiply(b, c.factor, c.colorMode, c.color, true); break;
        case 'recolor': b.c = sim.colorFor(b.c, c.colorMode, c.color); break;
        case 'destroy': b.dead = true; sim.emit('destroy', b.x, b.y, b.c); break;
        case 'spawn': {
          const nc = sim.colorFor(b.c, c.colorMode, c.color);
          for (let k = 0; k < c.factor; k++) {
            const a = sim.rng() * TAU, sp = 60 + sim.rng() * 140;
            sim.queueBall(c.tx + (sim.rng() * 2 - 1) * c.spread, c.ty + (sim.rng() * 2 - 1) * c.spread, Math.cos(a) * sp, Math.sin(a) * sp, nc, sim.settings.ballRadius);
          }
          sim.emit('multiply', c.tx, c.ty, nc, { factor: c.factor });
          break;
        }
        case 'teleport': {
          if (c.factor <= 0) { b.dead = true; return; }
          const nc = sim.colorFor(b.c, c.colorMode, c.color);
          for (let k = 0; k < c.factor; k++) {
            const nb = k === 0 ? b : sim.addBall(0, 0, 0, 0, nc, b.r);
            if (!nb) break;
            nb.c = nc; sim.teleport(nb, c.tx, c.ty - k * nb.r * 2.2, c.spread);
          }
          if (c.factor > 1) sim.emit('multiply', c.tx, c.ty, nc, { factor: c.factor });
          break;
        }
      }
    };
    if (c.shape === 'rect') out.push({ kind: 'rect', x0: c.x - c.w / 2, x1: c.x + c.w / 2, y0: c.y - c.h / 2, y1: c.y + c.h / 2, fn });
    else out.push({ kind: c.shape === 'outside' ? 'outside' : 'circle', cx: c.x, cy: c.y, r: c.r, fn });
  }
}

class GatePart extends Part {
  sensors(sim, out) {
    const c = this.cfg;
    out.push({ kind: 'seg', once: true, ax: c.x1, ay: c.y1, bx: c.x2, by: c.y2, fn: b => sim.multiply(b, c.factor, c.colorMode, c.color, true) });
  }
}

class SpawnerPart extends Part {
  constructor(cfg) { super(cfg); this.burstDone = false; this.acc = 0; this.emitted = 0; }
  fire(sim) {
    const c = this.cfg, a = (c.angle + (sim.rng() - 0.5) * c.spread) * DEG, sp = c.speed * (c.spread ? 0.7 + sim.rng() * 0.6 : 1);
    const r = c.radius > 0 ? c.radius : sim.settings.ballRadius;
    const j = c.count > 1 || c.rate ? r * 1.5 : r * 0.4;
    return sim.addBall(c.x + (sim.rng() - 0.5) * j * 2, c.y + (sim.rng() - 0.5) * j * 2, Math.cos(a) * sp, Math.sin(a) * sp, c.color % sim.pal.length, r);
  }
  update(sim, dt) {
    const c = this.cfg;
    if (sim.t < c.delay) return;
    if (!this.burstDone) { this.burstDone = true; for (let i = 0; i < c.count; i++) this.fire(sim); }
    if (c.rate > 0 && (!c.total || this.emitted < c.total)) {
      this.acc += c.rate * dt;
      while (this.acc >= 1) { this.acc -= 1; if (this.fire(sim)) this.emitted++; }
    }
  }
}

class ForcePart extends Part {
  update(sim, dt) {
    const c = this.cfg, x0 = c.x - c.w / 2, x1 = c.x + c.w / 2, y0 = c.y - c.h / 2, y1 = c.y + c.h / 2;
    for (const b of sim.balls) if (b.x > x0 && b.x < x1 && b.y > y0 && b.y < y1) { b.vx += c.fx * dt; b.vy += c.fy * dt; }
  }
}

const PART_CLASSES = { container: ContainerPart, wall: WallPart, conveyor: ConveyorPart, spinner: SpinnerPart, crusher: CrusherPart, press: PressPart, spiral: SpiralPart, pegs: PegsPart, slots: SlotsPart, zone: ZonePart, gate: GatePart, spawner: SpawnerPart, force: ForcePart };

/* ==========================================================================
   Physics: the simulation
   ========================================================================== */
const GX0 = -400, GY0 = -800, GW = WORLD_W + 800, GH = WORLD_H + 1400;
const SEG_CS = 40, SEG_COLS = Math.ceil(GW / SEG_CS), SEG_ROWS = Math.ceil(GH / SEG_CS);

class Sim {
  constructor(sceneCfg) {
    this.scene = clone(sceneCfg);
    this.settings = this.scene.settings;
    this.pal = this.settings.palette.length ? this.settings.palette : DEFAULT_PALETTE;
    this.rng = mulberry32(Math.round(this.settings.seed) || 1);
    this.t = 0; this.steps = 0; this.balls = []; this.queue = []; this.events = []; this.nextId = 1;
    this.parts = this.scene.parts.map(cfg => new PART_CLASSES[cfg.type](cfg));
    this.peak = 0; this.finale = null; this.ended = false; this.winner = -1;
    this.cap = Math.max(1, Math.round(this.settings.maxBalls));
    const cs = Math.max(8, this.settings.ballRadius * 2 + 1);
    this.bcs = cs; this.bcols = Math.ceil(GW / cs); this.brows = Math.ceil(GH / cs);
    this.bhead = new Int32Array(this.bcols * this.brows);
    this.bnext = new Int32Array(4096);
    this.segCells = Array.from({ length: SEG_COLS * SEG_ROWS }, () => []);
    this.touched = [];
    this.segs = []; this.arcs = []; this.bigSegs = []; this.sensorList = [];
    this.container = this.parts.find(p => p instanceof ContainerPart && !p.cfg.gaps) || this.parts.find(p => p instanceof ContainerPart) || null;
  }
  emit(type, x, y, c, extra) { if (this.events.length < 400) this.events.push(Object.assign({ type, x, y, c, t: this.t }, extra)); }
  get count() { return this.balls.length; }
  canSpawn() { return this.balls.length < this.cap; }
  addBall(x, y, vx, vy, c, r, m = 0, u = 0) {
    if (this.balls.length >= this.cap) return null;
    const b = { id: this.nextId++, x, y, vx, vy, r: r || this.settings.ballRadius, c: c | 0, m, u, hitCd: 0, cv: 0, pressCd: 0, dead: false, held: false };
    const k = this.container;
    if (k && !k.cfg.gaps && !k.broken) b.held = (x - k.cfg.x) ** 2 + (y - k.cfg.y) ** 2 < k.cfg.radius * k.cfg.radius;
    this.balls.push(b);
    if (this.balls.length > this.peak) this.peak = this.balls.length;
    return b;
  }
  queueBall(x, y, vx, vy, c, r) { this.queue.push([x, y, vx, vy, c, r]); }
  colorFor(c, mode, idx) {
    const n = this.pal.length;
    if (mode === 'next') return (c + 1) % n;
    if (mode === 'fixed') return ((idx | 0) % n + n) % n;
    if (mode === 'random') return Math.floor(this.rng() * n);
    return c;
  }
  multiply(b, factor, mode, idx, label) {
    factor = Math.round(factor);
    if (factor <= 0) { b.dead = true; this.emit('destroy', b.x, b.y, b.c); return; }
    const nc = this.colorFor(b.c, mode, idx);
    b.c = nc;
    for (let k = 1; k < factor; k++) {
      const a = this.rng() * TAU, sp = 40 + this.rng() * 90;
      if (!this.addBall(b.x + Math.cos(a) * b.r * 0.5, b.y + Math.sin(a) * b.r * 0.5, b.vx * 0.9 + Math.cos(a) * sp, b.vy * 0.9 + Math.sin(a) * sp, nc, b.r, b.m, b.u)) break;
    }
    if (factor > 1) this.emit('multiply', b.x, b.y, nc, { factor, label });
  }
  teleport(b, tx, ty, spread) {
    b.x = tx + (this.rng() * 2 - 1) * spread; b.y = ty; b.vx = (this.rng() * 2 - 1) * 30; b.vy = 0; b.m = 0; b.u = 0;
  }

  step() {
    const s = this.settings;
    if (this.ended) return;
    this.t += DT; this.steps++;
    for (const p of this.parts) p.update(this, DT);
    this.flushQueue();
    this.buildColliders();

    const g = s.gravity, drag = s.drag, minS = s.minSpeed, maxS = s.maxSpeed, freeze = this.finale && this.finale.type === 'freeze';
    const kd = drag ? 1 - drag * DT : 1;
    for (const b of this.balls) {
      b.vy += g * DT;
      if (drag) { b.vx *= kd; b.vy *= kd; }
      if (freeze) { b.vx *= 0.985; b.vy *= 0.985; }
      const sp2 = b.vx * b.vx + b.vy * b.vy;
      if (sp2 > maxS * maxS) { const k = maxS / Math.sqrt(sp2); b.vx *= k; b.vy *= k; }
      else if (minS > 0 && !freeze && sp2 < minS * minS) {
        if (sp2 < 1) { const a = this.rng() * TAU; b.vx = Math.cos(a) * minS; b.vy = Math.sin(a) * minS; }
        else { const k = lerp(1, minS / Math.sqrt(sp2), 0.05); b.vx *= k; b.vy *= k; }
      }
      b.x += b.vx * DT; b.y += b.vy * DT;
    }
    if (s.battle) this.teams = this.colorCounts();
    this.buildBallGrid();
    for (let it = 0; it < 2; it++) { this.solveBalls(); this.solveWalls(); }
    this.runSensors();
    this.cleanup();
    this.checkEnd();
  }

  flushQueue() {
    if (!this.queue.length) return;
    let budget = 10;
    while (this.queue.length && budget-- > 0) {
      const q = this.queue.shift();
      if (!this.addBall(q[0], q[1], q[2], q[3], q[4], q[5])) { this.queue.length = 0; break; }
    }
  }

  buildColliders() {
    for (const i of this.touched) this.segCells[i].length = 0;
    this.touched.length = 0;
    this.segs = []; this.arcs = []; this.bigSegs.length = 0;
    const exp = Math.max(8, this.settings.ballRadius) + 4;
    for (const p of this.parts) {
      const cur = p.segs(this.t);
      if (cur) {
        const prev = p.prevSegs && p.prevSegs.length === cur.length ? p.prevSegs : null;
        for (let i = 0; i < cur.length; i++) {
          const s = cur[i];
          if (prev) { const q = prev[i]; s.vax = (s.ax - q.ax) / DT; s.vay = (s.ay - q.ay) / DT; s.vbx = (s.bx - q.bx) / DT; s.vby = (s.by - q.by) / DT; }
          else { s.vax = s.vay = s.vbx = s.vby = 0; }
          const dx = s.bx - s.ax, dy = s.by - s.ay, L = Math.hypot(dx, dy);
          s.len2 = dx * dx + dy * dy; s.ux = L ? dx / L : 1; s.uy = L ? dy / L : 0; s.owner = p;
          this.segs.push(s);
          this.insertSeg(s, exp + s.hw);
        }
      }
      p.prevSegs = cur;
      const arcs = p.arcs(this.t);
      if (arcs) for (const a of arcs) this.arcs.push(a);
    }
  }
  insertSeg(s, e) {
    const x0 = Math.floor((Math.min(s.ax, s.bx) - e - GX0) / SEG_CS), x1 = Math.floor((Math.max(s.ax, s.bx) + e - GX0) / SEG_CS);
    const y0 = Math.floor((Math.min(s.ay, s.by) - e - GY0) / SEG_CS), y1 = Math.floor((Math.max(s.ay, s.by) + e - GY0) / SEG_CS);
    for (let cy = Math.max(0, y0); cy <= Math.min(SEG_ROWS - 1, y1); cy++)
      for (let cx = Math.max(0, x0); cx <= Math.min(SEG_COLS - 1, x1); cx++) {
        const i = cy * SEG_COLS + cx, cell = this.segCells[i];
        if (!cell.length) this.touched.push(i);
        cell.push(s);
      }
  }

  buildBallGrid() {
    const n = this.balls.length;
    if (this.bnext.length < n) this.bnext = new Int32Array(n * 2);
    this.bhead.fill(-1);
    this.big = [];
    const cs = this.bcs, half = cs / 2;
    for (let i = 0; i < n; i++) {
      const b = this.balls[i];
      if (b.r > half) { this.big.push(i); continue; }
      const cx = Math.floor((b.x - GX0) / cs), cy = Math.floor((b.y - GY0) / cs);
      if (cx < 0 || cy < 0 || cx >= this.bcols || cy >= this.brows) { b.gi = -1; continue; }
      const ci = cy * this.bcols + cx;
      b.gi = ci; this.bnext[i] = this.bhead[ci]; this.bhead[ci] = i;
    }
  }
  solveBalls() {
    const balls = this.balls, n = balls.length, cols = this.bcols, rows = this.brows, head = this.bhead, next = this.bnext;
    const e = this.settings.ballBounce;
    for (let i = 0; i < n; i++) {
      const a = balls[i];
      if (a.gi === undefined || a.gi < 0 || a.r > this.bcs / 2) continue;
      const cx = a.gi % cols, cy = (a.gi / cols) | 0;
      for (let oy = -1; oy <= 1; oy++) {
        const yy = cy + oy; if (yy < 0 || yy >= rows) continue;
        for (let ox = -1; ox <= 1; ox++) {
          const xx = cx + ox; if (xx < 0 || xx >= cols) continue;
          for (let j = head[yy * cols + xx]; j !== -1; j = next[j]) if (j > i) this.collideBalls(a, balls[j], e);
        }
      }
    }
    for (const bi of this.big) { const a = balls[bi]; for (let j = 0; j < n; j++) if (j !== bi && (balls[j].r <= this.bcs / 2 || j > bi)) this.collideBalls(a, balls[j], e); }
  }

    case 'crusher': return Math.abs(x - cfg.x) < cfg.boxW / 2 + 20 && Math.abs(y - cfg.y) < cfg.boxH / 2 + 12;
    default: return Math.hypot(x - cfg.x, y - cfg.y) < 26;
  }
}
canvas.addEventListener('pointerdown', ev => {
  if (!app.editing) return;
  const p = toWorld(ev), tol = Math.max(10, 14 * p.perPx);
  let best = null, bestD = tol;
  // when handles overlap, the selected part wins, then the part drawn on top
  const order = app.scene.parts.slice().sort((a, b) => (a.id === app.selectedId) - (b.id === app.selectedId));
  for (const cfg of order) for (const hd of partHandles(cfg)) {
    const d = Math.hypot(hd.x - p.x, hd.y - p.y);
    if (d <= bestD) { bestD = d; best = { cfg, hd }; }
  }
  if (!best) {
    const hit = app.scene.parts.slice().reverse().find(cfg => hitPart(cfg, p.x, p.y));
    if (hit) best = { cfg: hit, hd: partHandles(hit)[partHandles(hit).length - 1].kind === 'mid' ? partHandles(hit).find(x => x.kind === 'mid') : partHandles(hit)[0] };
  }
  if (!best) { app.selectedId = null; render(); if (app.tab === 'parts') renderPanel(); return; }
  app.selectedId = best.cfg.id; app.openId = best.cfg.id;
  drag = { cfg: best.cfg, hd: best.hd, sx: p.x, sy: p.y, orig: clone(best.cfg), moved: false };
  canvas.setPointerCapture(ev.pointerId);
  if (app.tab !== 'parts') setTab('parts'); else renderPanel();
  render();
});
canvas.addEventListener('pointermove', ev => {
  if (!drag) return;
  const p = toWorld(ev), dx = Math.round(p.x - drag.sx), dy = Math.round(p.y - drag.sy), c = drag.cfg, o = drag.orig;
  if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 2) return;
  drag.moved = true;
  if (drag.hd.kind === 'mid') { c.x1 = o.x1 + dx; c.y1 = o.y1 + dy; c.x2 = o.x2 + dx; c.y2 = o.y2 + dy; }
  else if (drag.hd.kind === 'main' && (c.type === 'slots' || c.type === 'zone') && drag.hd.kx === 'x') { c.x = o.x + dx; c.y = o.y + dy; }
  else { c[drag.hd.kx] = o[drag.hd.kx] + dx; c[drag.hd.ky] = o[drag.hd.ky] + dy; }
  app.templateKey = null;
  queueRebuild();
  syncFieldValues(c);
});
const endDrag = () => { if (drag) { if (drag.moved) { persist(); const el = $('part-' + drag.cfg.id); if (el) { const s = el.querySelector('.txt span'); if (s) s.textContent = PART_TYPES[drag.cfg.type].summary(drag.cfg); } } drag = null; } };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
function syncFieldValues(cfg) {
  const card = $('part-' + cfg.id); if (!card) return;
  card.querySelectorAll('input[type="number"][data-k]').forEach(inp => {
    const v = cfg[inp.dataset.k]; if (inp.value !== String(v)) { inp.value = v; const r = inp.previousElementSibling; if (r && r.type === 'range') r.value = v; }
  });
}

/* ==========================================================================
   Wiring
   ========================================================================== */
function fitStage() {
  const wrap = $('stageWrap'), box = $('stageBox');
  const mobile = window.matchMedia('(max-width: 860px)').matches;
  const r = wrap.getBoundingClientRect();
  let w = r.width, hgt = mobile ? Math.min(window.innerHeight * 0.74, w * 16 / 9) : r.height;
  if (w * 16 / 9 > hgt) w = hgt * 9 / 16; else hgt = w * 16 / 9;
  box.style.width = Math.floor(w) + 'px'; box.style.height = Math.floor(hgt) + 'px';
}
window.addEventListener('resize', fitStage);

$('playBtn').addEventListener('click', () => setPlaying(!app.playing));
$('restartBtn').innerHTML = ICONS.restart;
$('restartBtn').addEventListener('click', () => { rebuild(); if (!app.editing) setPlaying(true); });
$('speedSel').addEventListener('change', e => { app.speed = Number(e.target.value); });
$('editBtn').innerHTML = ICONS.edit + '<span>Edit</span>';
$('editBtn').addEventListener('click', () => setEditing(!app.editing));
$('recBtn').addEventListener('click', () => { if (app.recording) stopRecording(); else startRecording(); });
function paintSound() { $('soundBtn').innerHTML = audio.enabled ? ICONS.sound : ICONS.mute; $('soundBtn').setAttribute('aria-pressed', audio.enabled ? 'true' : 'false'); }
$('soundBtn').addEventListener('click', () => { audio.enabled = !audio.enabled; if (audio.enabled) audio.ensure(); paintSound(); });
$('seedBtn').addEventListener('click', () => {
  app.scene.settings.seed = 1 + Math.floor(Math.random() * 99999);
  persist(); rebuild(); if (!app.editing) setPlaying(true);
  if (app.tab === 'scene') renderPanel();
});
$('uiTheme').addEventListener('click', () => {
  const root = document.documentElement, cur = root.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  root.setAttribute('data-theme', dark ? 'light' : 'dark'); saveUi();
});
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
document.addEventListener('keydown', ev => {
  if (ev.target.closest('input, textarea, select') || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.code === 'Space' && !ev.target.closest('button')) { ev.preventDefault(); setPlaying(!app.playing); }
  else if (ev.key === 'r' || ev.key === 'R') { rebuild(); if (!app.editing) setPlaying(true); }
  else if (ev.key === 'e' || ev.key === 'E') setEditing(!app.editing);
});

loadInitial();
paintSound();
fitStage();
rebuild(false);
setTab(app.tab);
setPlaying(false);
requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { thumbCache.clear(); if (app.tab === 'templates') renderPanel(); render(); });

window.SimLab = { Sim, TEMPLATES, app, PART_TYPES, normalizeScene };
</script>
